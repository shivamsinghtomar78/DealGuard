services:
  - type: web
    name: dealguard-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # MongoDB
      - key: MONGODB_URI
        sync: false
      # AI Provider - Use OpenRouter for multi-model support
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: xiaomi/mimo-v2-flash:free
      # Fallback to Gemini if needed
      - key: GEMINI_API_KEY
        sync: false
      # Optional: LangSmith tracing
      - key: LANGCHAIN_TRACING_V2
        value: "false"
