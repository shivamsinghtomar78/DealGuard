services:
  - type: web
    name: dealguard-server
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: Set these in Render Dashboard
      - key: AI_SERVICE_URL
        sync: false  # Set to your AI service Render URL, e.g., https://dealguard-ai.onrender.com
      - key: SERVER_URL
        sync: false  # Set to this server's URL, e.g., https://dealguard-server.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false  # Set to your Vercel frontend URL
